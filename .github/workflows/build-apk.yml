name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  apk:
    name: Build and verify APK
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/android
      - name: Assemble installable APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify signature, Xposed metadata and SHA256
        id: package
        run: python3 scripts/ci/artifacts.py package --variant debug
      - name: Upload APK and verification metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
